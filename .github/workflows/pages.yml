name: Deploy app to GitHub Pages

# Not enabled: runs only when started by hand from the Actions tab, after the owner approves
# going public (docs/decisions.md, Phase 3 pre-registration, section 8). GitHub Pages must
# also be switched on in the repository settings.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app
      - id: deployment
        uses: actions/deploy-pages@v4
